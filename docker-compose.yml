services:
  postgres:
    image: postgres:16
    container_name: delivery_postgres
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery_app
      POSTGRES_PASSWORD: delivery_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_app -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: